name: CI

# Validates the declarative AWS state in deploy/ on every PR, and reports the
# `CI - Required Checks` status the org ruleset requires before merge. (cd.yaml
# only runs on v* tags, so without this no PR-time required check is produced and
# the PR stays merge-BLOCKED.)

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

jobs:
  retired-repo-links:
    name: Retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation links
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@61693f6ef2740f113ecd2a4ae01840557abe44e8  # v7.12.3
        with:
          enabled: "true"

      - name: Require a complete scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true

      - name: Prepare disposable README defect
        run: |
          mkdir -p "$RUNNER_TEMP/retired-links-fixture/.github"
          cp README.md AGENTS.md "$RUNNER_TEMP/retired-links-fixture/"
          printf '\n[Retired catalogue](https://github.com/devantler-tech/reusable-workflows)\n' >> "$RUNNER_TEMP/retired-links-fixture/README.md"
          cp .github/retired-repo-links.json "$RUNNER_TEMP/retired-links-fixture/.github/retired-repo-links.json"

      - name: Reject the retired README link
        id: retired
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@61693f6ef2740f113ecd2a4ae01840557abe44e8  # v7.12.3
        with:
          enabled: "true"
          working-directory: ${{ runner.temp }}/retired-links-fixture

      - name: Reject missing configuration
        id: missing
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@61693f6ef2740f113ecd2a4ae01840557abe44e8  # v7.12.3
        with:
          enabled: "true"
          config-file: .github/missing-retired-repo-links.json

      - name: Verify negative action outcomes
        if: ${{ always() }}
        env:
          CLEAN_VALIDATED: ${{ steps.links.outputs.validated }}
          RETIRED_OUTCOME: ${{ steps.retired.outcome }}
          RETIRED_VALIDATED: ${{ steps.retired.outputs.validated }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          MISSING_VALIDATED: ${{ steps.missing.outputs.validated }}
        run: |
          test "$CLEAN_VALIDATED" = true
          test "$RETIRED_OUTCOME" = failure
          test -z "$RETIRED_VALIDATED"
          test "$MISSING_OUTCOME" = failure
          test -z "$MISSING_VALIDATED"

      - name: Checkout released validator for diagnostic proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: bd0035dd8f41fcf1459b878882b8897443f8dc59  # v4.9.4
          path: .retired-repo-links-validator
          persist-credentials: false

      - name: Verify exact failure codes and diagnostics
        env:
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          go -C .retired-repo-links-validator/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$RUNNER_TEMP/retired-repo-links" .
          bash scripts/test-retired-repo-links.sh "$RUNNER_TEMP/retired-repo-links"

  validate-manifests:
    name: 🧹 Validate manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧹 Validate deploy/ kustomize build
        # kubectl (with built-in kustomize) is preinstalled on the runner. A
        # successful build proves the manifests are well-formed; the schema check
        # is validate-crossplane-schemas below.
        run: kubectl kustomize deploy/ > /dev/null

  validate-crossplane-schemas:
    name: 🧩 Validate Crossplane schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The CLI is downloaded from Crossplane's release host and checked against this digest
      # before it runs. The image supplies Crossplane's built-in schemas; keep it at the
      # version the platform runs (its crossplane HelmRelease).
      CROSSPLANE_CLI_VERSION: v2.5.0
      CROSSPLANE_CLI_SHA256: 065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e
      CROSSPLANE_IMAGE: xpkg.crossplane.io/crossplane/crossplane:v2.4.2
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📥 Install the Crossplane CLI
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/crossplane" \
            "https://cli.crossplane.io/stable/${CROSSPLANE_CLI_VERSION}/bin/linux_amd64/crossplane"
          echo "${CROSSPLANE_CLI_SHA256}  $RUNNER_TEMP/crossplane" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/crossplane"
          "$RUNNER_TEMP/crossplane" version --client

      - name: 🧩 Validate deploy/ and prove the gate blocks
        run: bash scripts/test-validate-crossplane-schemas.sh "$RUNNER_TEMP/crossplane"

      - name: 🔎 Compare the provider version with the platform's pin
        # Reported, not enforced: the platform moves its pin in its own repository, and a
        # failure here would turn every unrelated pull request red until this file follows.
        run: |
          pkg='^xpkg\.upbound\.io/[a-z0-9/-]+:v[0-9]+\.[0-9]+\.[0-9]+$'
          url=https://raw.githubusercontent.com/devantler-tech/platform/main/k8s/providers/hetzner/infrastructure/crossplane/provider-aws-iam.yaml
          ours=$(sed -n 's/^  package: //p' .github/crossplane-validate/extensions.yaml)
          if ! platform=$(curl -fsSL --retry 3 "$url" | sed -n 's/^  package: //p'); then
            echo "::warning title=Provider pin not compared::could not read the platform's provider-aws-iam pin"
            exit 0
          fi
          # Only a plain package reference is echoed, so file content cannot reach a workflow command.
          if ! [[ $ours =~ $pkg && $platform =~ $pkg ]]; then
            echo "::warning title=Provider pin not compared::a package line is missing or not a plain package reference"
            exit 0
          fi
          if [ "$ours" != "$platform" ]; then
            echo "::warning title=Provider pin mismatch::validated against ${ours}, but the platform runs ${platform}; update .github/crossplane-validate/extensions.yaml"
          else
            echo "Provider pin matches the platform: ${ours}"
          fi

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [validate-manifests, validate-crossplane-schemas, retired-repo-links]
    if: always()
    permissions: {}
    steps:
      - name: 📊 Evaluate job results
        uses: devantler-tech/.github/actions/aggregate-job-checks@3bc75c3a147f40ccdfee9a63602d15570f8af3b1 # v12.0.2
        with:
          job-results: >-
            ${{ needs.validate-manifests.result }}
            ${{ needs.validate-crossplane-schemas.result }}
            ${{ needs.retired-repo-links.result }}

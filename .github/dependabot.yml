version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      exclude:
        - "devantler-tech/*"
    # The publish-app action is an ordinary dependency: releases are signed by this
    # repository's own cd.yaml on its tag, whatever action revision runs
    # (devantler-tech/monorepo ADR 0017), so no platform approval gates its updates.

# EKS CI identity: what lets KSail's "System Test - EKS" workflow reach this AWS
# account through GitHub Actions OIDC, with no long-lived key stored anywhere.
#
# This repository owns one part of it: the account's GitHub Actions OIDC
# identity provider. The CI Role that trusts it, and the permissions boundary
# that caps what the Role may create, are owned by devantler-tech/platform on
# purpose: the cap is written inside the Role, so anyone who could edit the Role
# could remove it, and this public artifact must not be able to.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - github-oidc-provider.yaml
